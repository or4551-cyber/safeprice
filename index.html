<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceGuard Elite - Final Fix</title>
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --success: #22c55e; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: right; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .upload-area { border: 2px dashed #3b82f6; padding: 40px; text-align: center; border-radius: 15px; cursor: pointer; background: #f0f7ff; margin-top: 20px; }
        #loader { display: none; color: var(--primary); font-weight: bold; margin: 20px 0; text-align: center; }
        .result-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .error-box { display: none; background: #fee2e2; color: #b91c1c; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 12px; direction: ltr; text-align: left; white-space: pre-wrap; border: 1px solid #f87171; }
        .bad { color: var(--danger); font-weight: bold; }
        .good { color: var(--success); font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>PriceGuard Elite 🛡️</h1>
    <div style="margin-bottom:15px">
        <label>1. בחר ספק:</label>
        <select id="vendorSelect" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1;">
            <option value="yevuley_sade">יבולי שדה טמרה</option>
            <option value="tfuchan">תפוכן</option>
            <option value="elkayam">חטיפי אלקיים</option>
            <option value="tahini">מוטיפוד (טחינה)</option>
            <option value="teraplast">טרה פלסט</option>
        </select>
    </div>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <strong>📁 לחץ כאן להעלאת חשבונית</strong>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <div id="loader">ה-AI מנתח... נא להמתין 🧠</div>
    <div id="results"></div>
    <div id="errorBox" class="error-box"></div>
</div>

<script>
    const API_KEY = "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";

    const MASTER_DATA = {
        "yevuley_sade": { "חומוס מקומי 25 קג": 150, "פול אנגלי": 120, "מלפפון במלח": 50, "פלפל שיפקה": 38, "לפת דלי": 60, "זיתים סורי": 115, "שמן סויה": 115, "סוכר": 48 },
        "tfuchan": { "ציפס סטייק": 148.75, "כרובית סנפרוסט": 149, "בצל קלוף": 5.4, "כרובית מהדרין": 220 },
        "elkayam": { "קובה במילוי בשר": 82.5, "קובה צמחי": 82.5 },
        "tahini": { "טחינה גולמית 18 קג": 238.45 },
        "teraplast": { "אשפתון 75/90": 125, "גביע 1000": 150, "גביע 120": 240, "גביע 250": 230, "גביע 500": 287.17 }
    };

    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const vendor = document.getElementById('vendorSelect').value;
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');
        const errorBox = document.getElementById('errorBox');
        
        loader.style.display = 'block';
        resultsDiv.innerHTML = '';
        errorBox.style.display = 'none';

        const reader = new FileReader();
        reader.onloadend = async () => {
            const base64Image = reader.result.split(',')[1];
            await processInvoice(base64Image, vendor);
        };
        reader.readAsDataURL(file);
    };

    async function processInvoice(base64, vendorId) {
        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${API_KEY.trim()}`, 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{
                        role: "user",
                        content: [
                            { type: "text", text: "Analyze invoice. Hebrew. Return ONLY JSON: {\"items\": [{\"n\": \"name\", \"p\": price_number}]}" },
                            { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64}` } }
                        ]
                    }],
                    response_format: { type: "json_object" }
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(JSON.stringify(data, null, 2));
            }

            const extracted = JSON.parse(data.choices[0].message.content);
            showResults(extracted.items, vendorId);
        } catch (err) {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            errorBox.innerText = "שגיאת OpenAI:\n" + err.message;
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function showResults(items, vId) {
        const resultsDiv = document.getElementById('results');
        const master = MASTER_DATA[vId];

        items.forEach(item => {
            const matchKey = Object.keys(master).find(k => 
                item.n.includes(k) || k.includes(item.n)
            );
            const mPrice = matchKey ? master[matchKey] : null;
            
            resultsDiv.innerHTML += `
                <div class="result-item">
                    <div>
                        <strong>${item.n}</strong><br>
                        ${mPrice ? 
                            (item.p > mPrice ? `<span class="bad">חריגה! (מחירון: ${mPrice}₪)</span>` : `<span class="good">תקין ✅</span>`) 
                            : `<span style="color:orange">לא במחירון</span>`}
                    </div>
                    <div style="font-weight:bold">${item.p.toFixed(2)} ₪</div>
                </div>`;
        });
    }
</script>

</body>
</html>
