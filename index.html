<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceGuard Elite 🛡️</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; padding: 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .btn { background: #2563eb; color: white; padding: 15px; border: none; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; }
        #results { margin-top: 20px; text-align: right; }
        .bad { color: #ef4444; font-weight: bold; }
        .good { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>PriceGuard Elite 🛡️</h1>
    <p>בחר ספק והעלה חשבונית:</p>
    
    <select id="vendorSelect" style="width:100%; padding:12px; margin-bottom:20px; border-radius:10px;">
        <option value="yevuley_sade">יבולי שדה טמרה</option>
        <option value="tfuchan">תפוכן</option>
    </select>

    <button class="btn" onclick="document.getElementById('fileInput').click()">📁 בחר תמונה מהגלריה</button>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">

    <div id="loader" style="display:none; margin-top:20px;">מנתח נתונים... 🧠</div>
    <div id="results"></div>
</div>

<script>
    const API_KEY = "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";

    const MASTER_DATA = {
        "yevuley_sade": { "חומוס": 150, "סוכר": 48 },
        "tfuchan": { "ציפס": 148.75, "בצל": 5.4 }
    };

    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');
        loader.style.display = 'block';
        resultsDiv.innerHTML = '';

        const reader = new FileReader();
        reader.onloadend = async () => {
            const base64 = reader.result.split(',')[1];
            
            try {
                // שימוש ב-Proxy כדי לעקוף את חסימת ה-Failed to fetch
                const proxy = "https://cors-anywhere.herokuapp.com/";
                const url = "https://api.openai.com/v1/chat/completions";

                const response = await fetch(proxy + url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY.trim()}`,
                        "Content-Type": "application/json",
                        "x-requested-with": "XMLHttpRequest"
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{
                            role: "user",
                            content: [
                                { type: "text", text: "Extract items and prices to JSON: {\"items\":[{\"n\":\"name\",\"p\":1.0}]}" },
                                { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64}` } }
                            ]
                        }],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "שגיאה");

                const items = JSON.parse(data.choices[0].message.content).items;
                const vId = document.getElementById('vendorSelect').value;
                
                items.forEach(item => {
                    const mPrice = MASTER_DATA[vId][Object.keys(MASTER_DATA[vId]).find(k => item.n.includes(k))] || null;
                    resultsDiv.innerHTML += `<div>${item.n}: ${item.p}₪ ${mPrice ? (item.p > mPrice ? '<span class="bad">חריגה!</span>' : '<span class="good">תקין</span>') : ''}</div><hr>`;
                });

            } catch (err) {
                alert("שגיאה: " + err.message + "\n\nשים לב: אם מופיעה שגיאת חסימה, יש להיכנס לאתר cors-anywhere.herokuapp.com/corsdemo וללחוץ על הכפתור הכחול.");
            } finally {
                loader.style.display = 'none';
            }
        };
        reader.readAsDataURL(file);
    };
</script>

</body>
</html>
