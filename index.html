<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceGuard Debug Mode</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { background: #007bff; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-size: 16px; }
        #debugLog { background: #333; color: #0f0; padding: 10px; border-radius: 5px; margin-top: 20px; text-align: left; direction: ltr; font-size: 12px; display: none; overflow-x: auto; }
        .error-msg { color: red; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>PriceGuard Debug 🛡️</h2>
    <p>בדיקת חיבור ל-OpenAI</p>
    
    <button class="btn" onclick="document.getElementById('fileInput').click()">העלה תמונה לבדיקה</button>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">

    <div id="status"></div>
    <div id="debugLog"></div>
</div>

<script>
    // וודא שהמפתח הזה הוא בדיוק מה שקיבלת באתר של OpenAI
    const API_KEY = "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";

    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const status = document.getElementById('status');
        const debugLog = document.getElementById('debugLog');
        
        status.innerText = "שולח בקשה ל-OpenAI...";
        debugLog.style.display = "none";

        const reader = new FileReader();
        reader.onloadend = async () => {
            const base64 = reader.result.split(',')[1];
            
            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{
                            role: "user",
                            content: [
                                { type: "text", text: "json: {test:true}" },
                                { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64}` } }
                            ]
                        }],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    debugLog.style.display = "block";
                    debugLog.innerText = "Status: " + response.status + "\n" + JSON.stringify(data, null, 2);
                    status.innerHTML = "<div class='error-msg'>השרת החזיר שגיאה (ראה למטה)</div>";
                } else {
                    status.innerText = "החיבור הצליח! ה-AI זיהה את התמונה.";
                    console.log(data);
                }
            } catch (err) {
                status.innerText = "שגיאת רשת: " + err.message;
            }
        };
        reader.readAsDataURL(file);
    };
</script>

</body>
</html>
